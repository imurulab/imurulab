<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMURU</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Segoe UI",sans-serif;
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;

}

.header{
text-align:center;
margin-bottom:40px;
}

}

}

.container{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.08);
border-radius:20px;
padding:30px;
}

.card h2{
margin-bottom:20px;
color:#7dd3fc;
}

.stat{
margin-bottom:20px;
}

.stat-label{
font-size:0.9rem;
color:#94a3b8;
}

.stat-value{
font-size:2rem;
font-weight:bold;
margin-top:5px;
}

.rank{
color:#facc15;
}

.discovery{
margin-top:20px;
padding:15px;
border-radius:12px;
background:rgba(125,211,252,0.08);
}

.discovery p{
margin-top:8px;

}

.menu-item{

.footer{

}

@media(max-width:800px){

.container{
grid-template-columns:1fr;
}

.header h1{
font-size:3rem;
}

}

</style>
</head>

<body>

<div class="header">

<h1>IMURU</h1>

<p>創作と実験の研究所</p>

</div>

<div class="container">

<div class="card">

<h2>観測記録</h2>

<div class="stat">
<div class="stat-label">観測回数</div>
<div class="stat-value" id="visitCount">1</div>
</div>

<div class="stat">
<div class="stat-label">研究員ランク</div>

<div class="stat-label">次の昇格まで</div>
<div class="stat-value" id="nextRank">9</div>
</div>

<div class="stat-value" id="labLevel">Lv.1</div>
</div>

<div class="discovery">
<strong>本日の発見</strong>
<p id="message">ようこそ研究所へ。</p>
</div>

<div class="discovery">
<strong>本日の発想カード</strong>
<p id="ideaCard">読み込み中...</p>
</div>

</div>

<div class="card">

<h2>行き先を選ぶ</h2>

<div class="discovery">

<p>AIでゲームを作る実験を追加予定</p>
</div>

</div>

</div>

IMURU Research Network

<script>

let visits = Number(localStorage.getItem("imuru_visits") || 0);

visits++;

localStorage.setItem("imuru_visits", visits);

document.getElementById("visitCount").innerText = visits;

let rank = "見習い研究員";
let next = 10 - visits;

if(visits >= 10){
rank = "研究員";
next = 50 - visits;
}

if(visits >= 50){
rank = "主任研究員";
next = 100 - visits;
}

if(visits >= 100){
rank = "上級研究員";
next = 1000 - visits;
}

if(visits >= 1000){
rank = "伝説研究員";
next = 10000 - visits;
}

if(visits >= 10000){
rank = "創設者級研究員";
next = "到達";
}

document.getElementById("rank").innerText = rank;
document.getElementById("nextRank").innerText = next;

let labLevel = Math.floor(visits / 10) + 1;

document.getElementById("labLevel").innerText =
"Lv." + labLevel;

const messages = [
"ようこそ研究所へ。",
"観測を続けています。",
"アイデアは突然現れる。",
"今日は何を作りますか？",
"面白いことは実験から始まる。",
"小さなIMURUが増殖中。",
"創作の種を探しています。",
"発見は記録されました。"
];

document.getElementById("message").innerText =
messages[Math.floor(Math.random() * messages.length)];

const ideas = [
"足す",
"引く",
"逆転",
"巨大化",
"縮小",
"擬人化",
"合体",
"交換",
"未来化",
"自動化",
"分解する",
"混ぜる",
"再利用する",
"観察する"
];

document.getElementById("ideaCard").innerText =
ideas[Math.floor(Math.random() * ideas.length)];

</script>

</body>
</html>
