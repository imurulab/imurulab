<h3>湯水のごとく</h3>

<p>
意味は「惜しみなく大量に使うこと」。
</p>

<p>
現代では蛇口をひねれば水もお湯も出る。
それなのに「湯水のごとく使う」は贅沢の象徴として残っている。
</p>

<p>
昔はお湯を沸かすのも、水を運ぶのも大変だった。
つまりこの言葉は昔の生活感覚を保存した化石なのかもしれない。
</p>
